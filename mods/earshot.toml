changelog = "Plasmo Voice support: Earshot also talks on servers running Plasmo Voice 2.x, found by itself (no whisper there: Plasmo Voice has none). With voice chat off, nothing is sent to a Plasmo Voice server; each connection uses a new key, and Simple Voice Chat and Plasmo Voice never share a connection or queued messages; when the server reconnects you, a new session with a new key starts and nothing of the old one is reused. The speaker icon beside name tags now shows. Other players' voices now come from where they stand on remote servers, and you no longer show up in your own Players list. Built for Nightly 2026-11-22 f1bb66f."

